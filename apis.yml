aid: moveworks
name: Moveworks
description: >-
  Moveworks is an enterprise agentic AI assistant platform that lets employees search and act
  across 100+ business applications (Slack, ServiceNow, Workday, Jira, Salesforce, SAP, Microsoft)
  through conversational AI agents. Its "Build with Moveworks" developer platform and Agent Studio
  expose REST APIs to send events and proactive messages, drive AI Assistant conversations
  (including streaming), export analytics data, and receive inbound webhooks, plus a set of
  customer-hosted gateways (Content, Identity, Knowledge, Forms) that feed enterprise data to the
  AI. All APIs use HTTP Bearer authentication with OAuth 2.0 Client Credentials issuing short-lived
  access tokens, are published as OpenAPI 3.1 with a discoverable /.well-known/api-catalog, and are
  deployed across US, EU, Canada, GovCloud (FedRAMP), Japan and UK regions.

              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /groups/{groupId}/members:
    get:
      operationId: list-group-members
      summary: List group members
      description: List direct members (users or groups) of a group. No recursion supported.
      tags:
        - ''
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
        - name: $top
          in: query
          description: Number of items to return per page (default pagination)
          required: false
          schema:
            type: integer
        - name: $skiptoken
          in: query
          description: >-
            Used when the query parameters can be memoized into an encoded string containing filtering and pagination
            parameters. If the endpoint supports memoized paging, the first call can use $top and $skip, while
            @odata.nextLink will return with $skiptoken. If memoized querying is not supported, $top and $skip should be
            sufficient.
          required: false
          schema:
            type: string
        - name: $filter
          in: query
          required: false
          schema:
            type: string
        - name: $select
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Group members list response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMemberCollection'
        '400':
          description: Bad Request - The request was invalid or cannot be served.
          content:

servers:
  - url: https://content-gateway-example.com/v1
    description: https://content-gateway-example.com/v1
components:
  schemas:
    status_enum:
      type: string
      enum:
        - active
        - deleted
      title: status_enum
    custom_attributes:
      type: object
      additionalProperties:
        type: string
      description: A map of string to string for representing custom attributes.
      title: custom_attributes
    ContentObject:
      type: object
      properties:
        download_path:
          type: string
          description: 'URL for the download request. For file streams: use `/{id}/download`. Not required for HTML content.'
        mime_type:
          type: string
          description: >-
            Used to specify type of content. See our supported MIME types here:
            https://docs.moveworks.com/api-reference/content-gateway/supported-mime-types.
        size:
          type: integer
          format: int64
        sha1_hash:
          type: string
      required:
        - mime_type
      title: ContentObject
    node_reference:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        path:
          type: string
      required:
        - id
        - name
      title: node_reference
    Node:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique id for each file
        name:
          type: string
          description: User friendly name for the file
        status:
          $ref: '#/components/schemas/status_enum'
        custom_attributes:
          $ref: '#/components/schemas/custom_attributes'
        last_modified_datetime:
          type: string
          format: date-time
          description: Used to efficiently ingest content only updated since last ingestion
        last_modified_by:
          type: string
        created_datetime:
          type: string
          format: date-time
        created_by:
          type: string
        external_url:
          type: string
          description: External URL to redirect users
        metadata_url:
          type: string
          description: Used to retrieve metadata about individual files
        content:
          $ref: '#/components/schemas/ContentObject'
        parent_info:
          $ref: '#/components/schemas/node_reference'
        children_url:
          type: string
      required:
        - id
        - name
        - last_modified_datetime
        - external_url
      title: Node
    ODataContentResponse:
      type: object
      properties:
        '@odata.context':
          type: string
          description: URL to the metadata of the response.
        value:
          type: array
          items:
            $ref: '#/components/schemas/Node'
        '@odata.nextLink':
          type: string
          description: URL to fetch the next set of results.
      title: ODataContentResponse
    ErrorResponseError:
      type: object
      properties:
        code:
          type: string
          description: Standard error code (e.g., UNAUTHORIZED, INVALID_ARGUMENT, NOT_FOUND).
        message:
          type: string
          description: Human-readable explanation of the error.
      required:
        - code
        - message
      title: ErrorResponseError
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorResponseError'
      required:
        - error
      title: ErrorResponse
    ContentObjectWithBody:
      type: object
      properties:
        download_path:
          type: string
          description: 'URL for the download request. For file streams: use `/{id}/download`. Not required for HTML content.'
        mime_type:
          type: string
          description: >-
            Used to specify type of content. See our supported MIME types here:
            https://docs.moveworks.com/api-reference/content-gateway/supported-mime-types.
        size:
          type: integer
          format: int64
        sha1_hash:
          type: string
        body:
          type: string
          description: The HTML content. Required when mime_type is `text/html`.
      required:
        - mime_type
      title: ContentObjectWithBody
    NodeWithContent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique id for each file
        name:
          type: string
          description: User friendly name for the file
        status:
          $ref: '#/components/schemas/status_enum'
        custom_attributes:
          $ref: '#/components/schemas/custom_attributes'
        last_modified_datetime:
          type: string
          format: date-time
          description: Used to efficiently ingest content only updated since last ingestion
        last_modified_by:
          type: string
        created_datetime:
          type: string
          format: date-time
        created_by:
          type: string
        external_url:
          type: string
          description: External URL to redirect users
        metadata_url:
          type: string
          description: Used to retrieve metadata about individual files
        content:
          $ref: '#/components/schemas/ContentObjectWithBody'
        parent_info:
          $ref: '#/components/schemas/node_reference'
        children_url:
          type: string
      required:
        - id
        - name
        - last_modified_datetime
        - external_url
      title: NodeWithContent
    ODataContentMetadataResponse:
      type: object
      properties:
        '@odata.context':
          type: string
          description: URL to the metadata of the response.
        value:
          $ref: '#/components/schemas/NodeWithContent'
      title: ODataContentMetadataResponse
    UserMetadata:
      type: object
      properties: {}
      description: Custom key-value metadata for the user.
      title: UserMetadata
    User:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the user.
        primary_email_addr:
          type: string
          description: Primary email address of the user.
        full_name:
          type: string
          description: Full name of the user.
        state:
          type: string
          description: 'State of the user account. Enum: Active | Inactive'
        last_modified_datetime:
          type: string
          description: Last modification timestamp (ISO 8601).
        metadata:
          $ref: '#/components/schemas/UserMetadata'
          description: Custom key-value metadata for the user.
      title: User
    UserCollection:
      type: object
      properties:
        '@odata.context':
          type: string
        value:
          type: array
          items:
            $ref: '#/components/schemas/User'
        '@odata.nextLink':
          type: string
      title: UserCollection
    GroupMetadata:
      type: object
      properties: {}
      description: Custom key-value metadata for the group.
      title: GroupMetadata
    Group:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the group.
        name:
          type: string
          description: Name of the group.
        created_datetime:
          type: string
          description: Timestamp when the group was created.
        last_modified_datetime:
          type: string
          description: Timestamp when the group was last updated.
        metadata:
          $ref: '#/components/schemas/GroupMetadata'
          description: Custom key-value metadata for the group.
      title: Group
    GroupCollection:
      type: object
      properties:
        '@odata.context':
          type: string
        value:
          type: array
          items:
            $ref: '#/components/schemas/Group'
        '@odata.nextLink':
          type: string
      title: GroupCollection
    GroupMember:
      type: object
      properties:
        type:
          type: string
          description: 'Entity type. Enum: USER | GROUP'
        id:
          type: string
          description: ID of the member (user or group).
        name:
          type: string
          description: Name of the member (optional).
      title: GroupMember
    GroupMemberCollection:
      type: object
      properties:
        '@odata.context':
          type: string
        value:
          type: array
          items:
            $ref: '#/components/schemas/GroupMember'
        '@odata.nextLink':
          type: string
      title: GroupMemberCollection
    PermissionsMetadataModel:
      type: string
      enum:
        - resource_permission
        - hierarchy_permission

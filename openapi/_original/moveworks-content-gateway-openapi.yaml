  /files/{id}/permissions:
    get:
      operationId: get-content-permissions
      summary: Get content permissions
      description: >-
        Returns all user/group permissions on content. If permission model is 'hierarchy_permission', then
        `permissions_hierarchy` must be provided in the response.
      tags:
        - ''
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: $top
          in: query
          description: Number of items to return per page (default pagination)
          required: false
          schema:
            type: integer
        - name: $skip
          in: query
          description: Number of items to skip (default pagination offset)
          required: false
          schema:
            type: integer
        - name: $skiptoken
          in: query
          description: >-
            Used when the query parameters can be memoized into an encoded string containing filtering and pagination
            parameters. If the endpoint supports memoized paging, the first call can use $top and $skip, while
            @odata.nextLink will return with $skiptoken. If memoized querying is not supported, $top and $skip should be
            sufficient.
          required: false
          schema:

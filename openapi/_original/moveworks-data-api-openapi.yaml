openapi: 3.1.0
info:
  title: Data API
  version: 1.0.0
paths:
  /conversations:
    get:
      operationId: list-conversations
      summary: List conversations
      description: Retrieve all conversations occurring with the Moveworks AI Assistant.
      tags:
        - ''
      parameters:
        - name: $filter
          in: query
          description: This option allows the client to filter the resource that is address by request URL
          required: false
          schema:
            type: string
        - name: $select
          in: query
          description: This option allow the client to request a limited set of properties of an entity
          required: false
          schema:
            type: string
        - name: $orderby
          in: query
          description: This option allow the client to request resources in either ascending or descending order
          required: false
          schema:
            type: string
        - name: $top
          in: query
          description: This option request the number of items to be included in the result
          required: false
          schema:
            type: integer
        - name: $skip
          in: query
          description: >-
            This query option requests the number of items in the queried collection that are to be skipped and not
            included in the result.
          required: false
          schema:
            type: integer
        - name: $count
          in: query
          description: >-
            This option allows clients to request a count of the matching resources included with the resources in the
            result
          required: false
          schema:
            type: boolean
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved list of conversations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/conversations'
        '400':
          description: Bad request error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400ErrorResponse'
        '403':
          description: Forbidden error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/403ErrorResponse'
        '404':
          description: URL not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/404ErrorResponse'
        '429':
          description: Rate limiting exceeding error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/429ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/500ErrorResponse'
